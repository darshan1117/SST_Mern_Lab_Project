<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopKart — Premium Shopping Experience</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn {
      0% { transform: scale(0.92); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes toastSlide {
      from { transform: translateY(100%) scale(0.9); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-pop-in { animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-toast { animation: toastSlide 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    
    .card-hover {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card-hover:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 30px -10px rgba(79, 70, 229, 0.12);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, createContext, useContext } = React;

    const AppContext = createContext();

    const AppProvider = ({ children }) => {
      const [user, setUser] = useState(null);
      const [cart, setCart] = useState([]);
      const [wishlist, setWishlist] = useState([]);
      const [products, setProducts] = useState([]);
      const [orders, setOrders] = useState([]);
      const [loading, setLoading] = useState(true);
      const [page, setPage] = useState("products");
      const [currentOrderId, setCurrentOrderId] = useState(null);
      const [selectedProductModal, setSelectedProductModal] = useState(null);
      const [toast, setToast] = useState(null);

      const showToast = (message, type = "success") => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };

      const fetchUser = async () => {
        try {
          const res = await fetch("/customers/me");
          if (res.ok) {
            const data = await res.json();
            setUser(data);
          } else {
            setUser(null);
          }
        } catch (err) {
          setUser(null);
        }
      };

      const fetchProducts = async () => {
        try {
          const res = await fetch("/products");
          const data = await res.json();
          if (data.products) setProducts(data.products);
        } catch (err) {}
      };

      const fetchCart = async () => {
        if (!user) return setCart([]);
        try {
          const res = await fetch("/cart");
          if (res.ok) {
            const data = await res.json();
            setCart(data.cart || []);
          }
        } catch (err) {}
      };

      const fetchWishlist = async () => {
        if (!user) return setWishlist([]);
        try {
          const res = await fetch("/wishlist");
          if (res.ok) {
            const data = await res.json();
            setWishlist(data.wishlist || []);
          }
        } catch (err) {}
      };

      const fetchOrders = async () => {
        if (!user) return setOrders([]);
        try {
          const res = await fetch("/orders");
          if (res.ok) {
            const data = await res.json();
            setOrders(data.orders || []);
          }
        } catch (err) {}
      };

      useEffect(() => {
        const init = async () => {
          setLoading(true);
          await fetchProducts();
          await fetchUser();
          setLoading(false);
        };
        init();
      }, []);

      useEffect(() => {
        if (user) {
          fetchCart();
          fetchWishlist();
          fetchOrders();
        } else {
          setCart([]);
          setWishlist([]);
          setOrders([]);
        }
      }, [user]);

      const cartCount = cart.reduce((acc, item) => acc + (item.quantity || 1), 0);
      const wishlistCount = wishlist.length;

      return (
        <AppContext.Provider value={{
          user, setUser, cart, setCart, wishlist, setWishlist, products, orders,
          loading, page, setPage, currentOrderId, setCurrentOrderId,
          selectedProductModal, setSelectedProductModal,
          fetchUser, fetchProducts, fetchCart, fetchWishlist, fetchOrders,
          cartCount, wishlistCount, toast, showToast
        }}>
          {children}
        </AppContext.Provider>
      );
    };

    const useApp = () => useContext(AppContext);

    const Navbar = () => {
      const { user, cartCount, wishlistCount, page, setPage, setUser, showToast } = useApp();

      const handleLogout = async () => {
        await fetch("/customers/logout", { method: "POST" });
        setUser(null);
        showToast("Logged out successfully");
        setPage("login");
      };

      return (
        <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-xs">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-18 flex items-center justify-between">
            <div className="flex items-center space-x-3 cursor-pointer group" onClick={() => setPage("products")}>
              <div className="bg-indigo-600 text-white p-2.5 rounded-2xl font-extrabold text-xl tracking-wider group-hover:scale-105 transition-transform">SK</div>
              <div>
                <span className="font-extrabold text-2xl text-slate-900 tracking-tight block leading-none">ShopKart</span>
                <span className="text-[10px] font-bold uppercase tracking-widest text-indigo-600">Official Store</span>
              </div>
            </div>

            <div className="flex items-center space-x-6">
              <button 
                onClick={() => setPage("products")} 
                className={`font-bold text-sm transition-all ${page === "products" ? "text-indigo-600 border-b-2 border-indigo-600 pb-1" : "text-slate-600 hover:text-slate-900"}`}
              >
                Catalogue
              </button>

              {user ? (
                <>
                  <button 
                    onClick={() => setPage("wishlist")} 
                    className={`font-bold text-sm transition-all flex items-center space-x-1.5 ${page === "wishlist" ? "text-indigo-600 border-b-2 border-indigo-600 pb-1" : "text-slate-600 hover:text-slate-900"}`}
                  >
                    <span>Wishlist</span>
                    <span className="bg-rose-100 text-rose-600 text-xs px-2 py-0.5 rounded-full font-black">{wishlistCount}</span>
                  </button>

                  <button 
                    onClick={() => setPage("cart")} 
                    className={`font-bold text-sm transition-all flex items-center space-x-1.5 ${page === "cart" ? "text-indigo-600 border-b-2 border-indigo-600 pb-1" : "text-slate-600 hover:text-slate-900"}`}
                  >
                    <span>Cart</span>
                    <span className="bg-indigo-600 text-white text-xs px-2.5 py-0.5 rounded-full font-black shadow-xs">{cartCount}</span>
                  </button>

                  <button 
                    onClick={() => setPage("orders")} 
                    className={`font-bold text-sm transition-all ${page === "orders" ? "text-indigo-600 border-b-2 border-indigo-600 pb-1" : "text-slate-600 hover:text-slate-900"}`}
                  >
                    My Orders
                  </button>

                  <div className="pl-4 border-l border-slate-200 flex items-center space-x-3">
                    <div className="flex items-center space-x-2 bg-slate-100 px-3 py-1.5 rounded-full">
                      <span className="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                      <span className="text-xs font-bold text-slate-800">{user.fullName}</span>
                    </div>
                    <button 
                      onClick={handleLogout}
                      className="text-xs text-rose-600 hover:text-rose-800 font-bold border border-rose-200 hover:border-rose-300 px-3 py-1.5 rounded-xl transition-all active:scale-95"
                    >
                      Logout
                    </button>
                  </div>
                </>
              ) : (
                <div className="flex items-center space-x-3">
                  <button 
                    onClick={() => setPage("login")} 
                    className="text-sm font-bold text-slate-700 hover:text-slate-900 px-3 py-1.5"
                  >
                    Login
                  </button>
                  <button 
                    onClick={() => setPage("register")} 
                    className="text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 px-4 py-2 rounded-xl transition-all shadow-sm active:scale-95"
                  >
                    Register
                  </button>
                </div>
              )}
            </div>
          </div>
        </header>
      );
    };

    const ProductsPage = () => {
      const { products, user, wishlist, fetchCart, fetchWishlist, setPage, setSelectedProductModal, showToast } = useApp();
      const [category, setCategory] = useState("All");
      const [search, setSearch] = useState("");
      const [sortBy, setSortBy] = useState("featured");
      const [loadingId, setLoadingId] = useState(null);

      const categoryCounts = products.reduce((acc, p) => {
        acc[p.category] = (acc[p.category] || 0) + 1;
        return acc;
      }, {});

      const categories = ["All", ...Object.keys(categoryCounts)];

      let filtered = products.filter(p => {
        const matchesCat = category === "All" || p.category === category;
        const matchesSearch = p.name.toLowerCase().includes(search.toLowerCase()) || p.description.toLowerCase().includes(search.toLowerCase());
        return matchesCat && matchesSearch;
      });

      if (sortBy === "price-low") filtered.sort((a, b) => a.price - b.price);
      if (sortBy === "price-high") filtered.sort((a, b) => b.price - a.price);
      if (sortBy === "rating") filtered.sort((a, b) => (b.rating || 0) - (a.rating || 0));

      const isWishlisted = (productId) => wishlist.some(item => (item._id || item) === productId);

      const handleAddToCart = async (productId) => {
        if (!user) {
          showToast("Please login to add items to cart", "error");
          return setPage("login");
        }
        setLoadingId(productId);
        try {
          const res = await fetch(`/cart/${productId}`, { method: "POST" });
          const data = await res.json();
          if (res.ok && data.success) {
            showToast("Added to cart! 🛒");
            await fetchCart();
          } else {
            showToast(data.message || "Failed to add to cart", "error");
          }
        } catch (err) {
          showToast("Network error", "error");
        } finally {
          setLoadingId(null);
        }
      };

      const handleToggleWishlist = async (productId) => {
        if (!user) {
          showToast("Please login to save wishlist items", "error");
          return setPage("login");
        }
        try {
          const res = await fetch(`/wishlist/${productId}/toggle`, { method: "PATCH" });
          const data = await res.json();
          if (res.ok && data.success) {
            showToast(data.saved ? "Added to wishlist ♥" : "Removed from wishlist");
            await fetchWishlist();
          }
        } catch (err) {
          showToast("Error updating wishlist", "error");
        }
      };

      return (
        <div className="max-w-7xl mx-auto px-4 py-8 animate-fade-in space-y-8">
          {/* Hero Banner Carousel Section */}
          <div className="relative bg-gradient-to-r from-indigo-900 via-indigo-800 to-slate-900 text-white rounded-3xl p-8 sm:p-12 overflow-hidden shadow-xl">
            <div className="relative z-10 max-w-xl space-y-4">
              <span className="inline-block bg-indigo-500/30 border border-indigo-400/40 text-indigo-200 text-xs px-3.5 py-1 rounded-full font-bold uppercase tracking-wider">
                🌟 New Arrival Collection 2026
              </span>
              <h1 className="text-3xl sm:text-5xl font-black leading-tight tracking-tight">
                Upgrade Your Tech & Lifestyle.
              </h1>
              <p className="text-indigo-200 text-sm sm:text-base">
                Discover flagship headphones, ergonomic workstations, smart wearables, and premium leather accessories.
              </p>
              <div className="pt-2 flex items-center space-x-4">
                <button onClick={() => setCategory("Electronics")} className="bg-white text-indigo-950 font-extrabold text-sm px-6 py-3 rounded-xl shadow-lg hover:bg-indigo-50 transition-all active:scale-95">
                  Shop Electronics →
                </button>
                <button onClick={() => setCategory("Computing")} className="bg-indigo-700/50 hover:bg-indigo-700 text-white font-bold text-sm px-6 py-3 rounded-xl transition-all border border-indigo-500/40">
                  Workstation Gear
                </button>
              </div>
            </div>
            <div className="absolute right-0 bottom-0 opacity-20 pointer-events-none text-[220px] font-black leading-none select-none text-indigo-400">
              SK
            </div>
          </div>

          {/* Search, Filter & Sort Controls */}
          <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs space-y-4">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div className="relative flex-1">
                <input
                  type="text"
                  placeholder="Search 19+ premium products by name or feature..."
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                  className="w-full pl-4 pr-10 py-3 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-all"
                />
              </div>

              <div className="flex items-center space-x-3">
                <span className="text-xs font-bold text-slate-500 uppercase tracking-wider">Sort by:</span>
                <select
                  value={sortBy}
                  onChange={(e) => setSortBy(e.target.value)}
                  className="px-4 py-3 border border-slate-300 rounded-xl text-xs font-bold text-slate-800 bg-slate-50 focus:outline-none cursor-pointer"
                >
                  <option value="featured">Featured / Best Sellers</option>
                  <option value="price-low">Price: Low to High</option>
                  <option value="price-high">Price: High to Low</option>
                  <option value="rating">Highest Rated (★)</option>
                </select>
              </div>
            </div>

            {/* Category Pills */}
            <div className="flex items-center space-x-2 overflow-x-auto pt-2 border-t border-slate-100">
              {categories.map(cat => {
                const count = cat === "All" ? products.length : categoryCounts[cat];
                return (
                  <button
                    key={cat}
                    onClick={() => setCategory(cat)}
                    className={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all active:scale-95 flex items-center space-x-1.5 ${category === cat ? "bg-indigo-600 text-white shadow-md" : "bg-slate-100 text-slate-700 hover:bg-slate-200"}`}
                  >
                    <span>{cat}</span>
                    <span className={`px-2 py-0.5 rounded-full text-[10px] ${category === cat ? "bg-indigo-800 text-white" : "bg-white text-slate-600 font-bold"}`}>{count}</span>
                  </button>
                );
              })}
            </div>
          </div>

          {/* Product Grid */}
          <div className="space-y-4">
            <div className="flex justify-between items-center text-xs font-bold text-slate-500 px-1">
              <span>Showing {filtered.length} of {products.length} Products</span>
              {search && <span>Filtered by: "{search}"</span>}
            </div>

            {filtered.length === 0 ? (
              <div className="text-center py-20 bg-white rounded-3xl border border-slate-200 animate-pop-in space-y-3">
                <div className="text-5xl">🔍</div>
                <h3 className="text-xl font-bold text-slate-900">No products found</h3>
                <p className="text-slate-500 text-sm">Try adjusting your search keywords or category filters.</p>
                <button onClick={() => { setSearch(""); setCategory("All"); }} className="bg-indigo-600 text-white font-bold px-5 py-2.5 rounded-xl text-xs">
                  Reset All Filters
                </button>
              </div>
            ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                {filtered.map(product => {
                  const wish = isWishlisted(product._id);
                  const discount = product.originalPrice ? Math.round(((product.originalPrice - product.price) / product.originalPrice) * 100) : 0;

                  return (
                    <div key={product._id} className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-xs card-hover flex flex-col justify-between">
                      <div>
                        <div className="relative h-60 bg-slate-100 overflow-hidden group">
                          <img 
                            src={product.image} 
                            alt={product.name} 
                            className="w-full h-full object-cover group-hover:scale-108 transition-transform duration-500"
                          />

                          {discount > 0 && (
                            <span className="absolute top-3 left-3 bg-rose-600 text-white text-[11px] font-black px-2.5 py-1 rounded-md shadow-md">
                              {discount}% OFF
                            </span>
                          )}

                          <button
                            onClick={() => handleToggleWishlist(product._id)}
                            className={`absolute top-3 right-3 p-2.5 rounded-full backdrop-blur-md transition-all active:scale-125 ${wish ? "bg-rose-500 text-white shadow-md" : "bg-white/90 text-slate-600 hover:bg-white"}`}
                            title={wish ? "Remove from wishlist" : "Add to wishlist"}
                          >
                            {wish ? "♥" : "♡"}
                          </button>

                          <button
                            onClick={() => setSelectedProductModal(product)}
                            className="absolute bottom-3 left-3 right-3 bg-slate-900/90 hover:bg-slate-900 backdrop-blur-md text-white font-bold text-xs py-2 rounded-xl opacity-0 group-hover:opacity-100 transition-opacity text-center shadow-lg"
                          >
                            👁️ Quick View
                          </button>
                        </div>

                        <div className="p-4 space-y-2">
                          <div className="flex items-center justify-between">
                            <span className="text-[10px] font-extrabold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md">
                              {product.category}
                            </span>
                            <div className="flex items-center space-x-1 text-amber-500 text-xs font-bold">
                              <span>★ {product.rating || 4.8}</span>
                              <span className="text-slate-400 font-normal">({product.reviewsCount || 120})</span>
                            </div>
                          </div>

                          <h3 
                            onClick={() => setSelectedProductModal(product)}
                            className="font-bold text-base text-slate-900 line-clamp-1 hover:text-indigo-600 cursor-pointer transition-colors"
                          >
                            {product.name}
                          </h3>

                          <p className="text-slate-500 text-xs line-clamp-2 leading-relaxed">{product.description}</p>

                          <div className="pt-2 flex items-baseline justify-between">
                            <div>
                              <span className="text-xl font-black text-slate-900">₹{product.price.toLocaleString("en-IN")}</span>
                              {product.originalPrice && (
                                <span className="text-xs text-slate-400 line-through ml-2">₹{product.originalPrice.toLocaleString("en-IN")}</span>
                              )}
                            </div>
                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${product.stock > 0 ? "bg-emerald-50 text-emerald-700 border border-emerald-200" : "bg-rose-50 text-rose-700 border border-rose-200"}`}>
                              {product.stock > 0 ? `${product.stock} left` : "Out of stock"}
                            </span>
                          </div>
                        </div>
                      </div>

                      <div className="p-4 pt-0">
                        <button
                          onClick={() => handleAddToCart(product._id)}
                          disabled={product.stock <= 0 || loadingId === product._id}
                          className={`w-full py-2.5 rounded-xl font-bold text-xs transition-all shadow-md active:scale-95 ${product.stock <= 0 ? "bg-slate-100 text-slate-400 cursor-not-allowed" : "bg-indigo-600 hover:bg-indigo-700 text-white"}`}
                        >
                          {loadingId === product._id ? "Adding..." : "Add to Cart 🛒"}
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          {/* Trust Guarantees Bar */}
          <div className="grid grid-cols-1 md:grid-cols-4 gap-4 bg-white p-6 rounded-3xl border border-slate-200 shadow-xs text-center">
            <div className="space-y-1">
              <div className="text-2xl">🚚</div>
              <h4 className="font-bold text-slate-900 text-xs">Free Express Shipping</h4>
              <p className="text-slate-500 text-[11px]">On all orders over ₹999 across India</p>
            </div>
            <div className="space-y-1">
              <div className="text-2xl">🔒</div>
              <h4 className="font-bold text-slate-900 text-xs">Razorpay Test Payments</h4>
              <p className="text-slate-500 text-[11px]">100% Secure & HMAC SHA256 Verified</p>
            </div>
            <div className="space-y-1">
              <div className="text-2xl">↺</div>
              <h4 className="font-bold text-slate-900 text-xs">30-Day Easy Returns</h4>
              <p className="text-slate-500 text-[11px]">No questions asked replacement policy</p>
            </div>
            <div className="space-y-1">
              <div className="text-2xl">💬</div>
              <h4 className="font-bold text-slate-900 text-xs">24/7 Dedicated Support</h4>
              <p className="text-slate-500 text-[11px]">Instant help for orders and tracking</p>
            </div>
          </div>
        </div>
      );
    };

    const ProductQuickViewModal = () => {
      const { selectedProductModal, setSelectedProductModal, fetchCart, fetchWishlist, wishlist, user, setPage, showToast } = useApp();
      if (!selectedProductModal) return null;

      const p = selectedProductModal;
      const wish = wishlist.some(item => (item._id || item) === p._id);

      const handleAddToCart = async () => {
        if (!user) {
          showToast("Please login first", "error");
          setSelectedProductModal(null);
          return setPage("login");
        }
        const res = await fetch(`/cart/${p._id}`, { method: "POST" });
        if (res.ok) {
          showToast("Added to cart! 🛒");
          await fetchCart();
          setSelectedProductModal(null);
        }
      };

      const handleToggleWishlist = async () => {
        if (!user) {
          showToast("Please login first", "error");
          setSelectedProductModal(null);
          return setPage("login");
        }
        const res = await fetch(`/wishlist/${p._id}/toggle`, { method: "PATCH" });
        const data = await res.json();
        if (res.ok && data.success) {
          showToast(data.saved ? "Added to wishlist ♥" : "Removed from wishlist");
          await fetchWishlist();
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
          <div className="bg-white rounded-3xl max-w-2xl w-full p-6 space-y-6 border border-slate-200 shadow-2xl relative animate-pop-in">
            <button 
              onClick={() => setSelectedProductModal(null)}
              className="absolute top-4 right-4 text-slate-400 hover:text-slate-900 font-bold text-xl w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center"
            >
              ✕
            </button>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-6 items-center">
              <img src={p.image} alt={p.name} className="w-full h-64 object-cover rounded-2xl bg-slate-100" />
              <div className="space-y-3">
                <span className="text-xs font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md">{p.category}</span>
                <h3 className="font-extrabold text-xl text-slate-900">{p.name}</h3>
                <div className="flex items-center space-x-2 text-amber-500 text-xs font-bold">
                  <span>★ {p.rating || 4.8}</span>
                  <span className="text-slate-400 font-medium">({p.reviewsCount || 120} reviews)</span>
                </div>
                <p className="text-slate-600 text-xs leading-relaxed">{p.description}</p>
                <div className="pt-2">

          await fetchWishlist();
        }
      };

      const handleMoveToCart = async (productId) => {
        await fetch(`/cart/${productId}`, { method: "POST" });
        await fetch(`/wishlist/${productId}`, { method: "DELETE" });

        await fetchCart();
        await fetchWishlist();

                      <h3 className="font-bold text-slate-900 text-base line-clamp-1">{product.name}</h3>

                  <div className="p-4 pt-0 space-y-2">

                    <button onClick={() => handleRemove(product._id)} className="w-full py-2 bg-slate-100 hover:bg-rose-50 text-slate-600 hover:text-rose-600 font-bold text-xs rounded-xl active:scale-95">
                      Remove
                    </button>
                  </div>
                </div>
              ))}
            </div>
          )}

      );

    const CartPage = () => {
      const { cart, fetchCart, setPage, showToast } = useApp();

      const handleUpdateQty = async (productId, currentQty, delta) => {
        const newQty = currentQty + delta;
        if (newQty < 1) return;
        const res = await fetch(`/cart/${productId}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ quantity: newQty })
        });
        const data = await res.json();
        if (res.ok) await fetchCart();
        else showToast(data.message || "Quantity error", "error");
      };

      const handleRemove = async (productId) => {
        const res = await fetch(`/cart/${productId}`, { method: "DELETE" });
        if (res.ok) {
          showToast("Item removed from cart");
          await fetchCart();
        }
      };

      const totalItems = cart.reduce((acc, item) => acc + (item.quantity || 1), 0);
      const subtotal = cart.reduce((acc, item) => acc + ((item.product?.price || 0) * (item.quantity || 1)), 0);

      return (
        <div className="max-w-7xl mx-auto px-4 py-8 animate-fade-in space-y-6">

            <div className="text-center py-20 bg-white rounded-3xl border border-slate-200 max-w-lg mx-auto animate-pop-in space-y-3">

                {cart.map(item => {

                  return (
                    <div key={p._id || Math.random()} className="bg-white p-5 rounded-2xl border border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-4 shadow-xs card-hover">
                      <div className="flex items-center space-x-4 w-full sm:w-auto">
                        <img src={p.image} alt={p.name} className="w-20 h-20 object-cover rounded-xl bg-slate-100 flex-shrink-0" />
                        <div>
                          <h4 className="font-bold text-slate-900 text-base line-clamp-1">{p.name}</h4>
                          <p className="text-slate-500 text-xs mt-1">₹{p.price?.toLocaleString("en-IN")} each</p>
                          <span className="text-xs text-slate-400 font-semibold">Stock: {p.stock}</span>
                        </div>
                      </div>

                      <div className="flex items-center justify-between sm:justify-end space-x-6 w-full sm:w-auto border-t sm:border-t-0 pt-3 sm:pt-0">
                        <div className="flex items-center border border-slate-200 rounded-xl bg-slate-50">
                          <button onClick={() => handleUpdateQty(p._id, item.quantity, -1)} disabled={item.quantity <= 1} className="px-3 py-1.5 text-slate-600 font-bold active:scale-90">-</button>
                          <span className="px-3 py-1.5 text-xs font-black text-slate-900">{item.quantity}</span>
                          <button onClick={() => handleUpdateQty(p._id, item.quantity, 1)} disabled={item.quantity >= p.stock} className="px-3 py-1.5 text-slate-600 font-bold active:scale-90">+</button>
                        </div>

                        <div className="text-right">
                          <p className="font-black text-slate-900 text-base">₹{((p.price || 0) * item.quantity).toLocaleString("en-IN")}</p>
                          <button onClick={() => handleRemove(p._id)} className="text-xs text-rose-600 font-bold hover:underline mt-1">Remove</button>

                  <div className="flex justify-between text-slate-600"><span>Shipping</span><span className="font-bold text-emerald-600">FREE</span></div>

                  Proceed to Checkout →
                </button>
              </div>
            </div>
          )}
        </div>
      );

    const CheckoutPage = () => {
      const { user, cart, fetchCart, fetchOrders, setPage, setCurrentOrderId, showToast } = useApp();
      const [form, setForm] = useState({
        fullName: user?.fullName || "",
        phone: user?.phone || "",
        addressLine1: "",
        city: "",
        state: "",
        pincode: ""
      });
      const [errors, setErrors] = useState({});
      const [submitting, setSubmitting] = useState(false);

      const validate = () => {
        const errs = {};
        if (!form.fullName.trim()) errs.fullName = "Full Name is required";
        if (!form.phone.trim() || !/^\d{10}$/.test(form.phone.trim())) errs.phone = "Valid 10-digit phone required";
        if (!form.addressLine1.trim()) errs.addressLine1 = "Address is required";
        if (!form.city.trim()) errs.city = "City is required";
        if (!form.state.trim()) errs.state = "State is required";
        if (!form.pincode.trim() || !/^\d{6}$/.test(form.pincode.trim())) errs.pincode = "Valid 6-digit pincode required";
        setErrors(errs);
        return Object.keys(errs).length === 0;
      };

      const handlePlaceOrder = async (e) => {
        e.preventDefault();
        if (!validate()) return;
        setSubmitting(true);
        try {
          const res = await fetch("/orders/create-payment-order", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ shippingAddress: form })
          });
          const data = await res.json();
          if (!res.ok || !data.success) {
            showToast(data.message || "Checkout failed", "error");
            setSubmitting(false);
            return;
          }

          const { shopKartOrderId, razorpayOrderId } = data;
          const mockPaymentId = `pay_sim_${Date.now()}`;

          const verifyRes = await fetch("/orders/verify-payment", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              shopKartOrderId,
              razorpay_order_id: razorpayOrderId,
              razorpay_payment_id: mockPaymentId,
              razorpay_signature: "simulated_test_signature_valid"
            })
          });

          const verifyData = await verifyRes.json();
          if (verifyRes.ok && verifyData.success) {
            showToast("Order placed successfully! 🎉");
            await fetchCart();
            await fetchOrders();
            setCurrentOrderId(shopKartOrderId);
            setPage("success");
          } else {
            showToast("Payment verification failed", "error");
          }
        } catch (err) {
          showToast("Network error during checkout", "error");
        } finally {
          setSubmitting(false);
        }
      };

      const subtotal = cart.reduce((acc, item) => acc + ((item.product?.price || 0) * (item.quantity || 1)), 0);

      return (
        <div className="max-w-5xl mx-auto px-4 py-8 animate-fade-in space-y-6">

          <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
            <form onSubmit={handlePlaceOrder} className="md:col-span-2 bg-white p-6 rounded-3xl border border-slate-200 space-y-4 shadow-xs">
              <h3 className="font-extrabold text-xl text-slate-900 pb-2 border-b border-slate-100">Shipping Details</h3>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">Full Name *</label>
                  <input type="text" value={form.fullName} onChange={(e) => setForm({...form, fullName: e.target.value})} className="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
                  {errors.fullName && <p className="text-rose-500 text-xs mt-1 font-bold">{errors.fullName}</p>}
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">Phone Number (10 digits) *</label>
                  <input type="text" value={form.phone} onChange={(e) => setForm({...form, phone: e.target.value})} className="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
                  {errors.phone && <p className="text-rose-500 text-xs mt-1 font-bold">{errors.phone}</p>}
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Address Line *</label>
                <input type="text" placeholder="House number, street address, locality" value={form.addressLine1} onChange={(e) => setForm({...form, addressLine1: e.target.value})} className="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
                {errors.addressLine1 && <p className="text-rose-500 text-xs mt-1 font-bold">{errors.addressLine1}</p>}
              </div>

              <div className="grid grid-cols-3 gap-3">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">City *</label>
                  <input type="text" value={form.city} onChange={(e) => setForm({...form, city: e.target.value})} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" />
                  {errors.city && <p className="text-rose-500 text-xs mt-1 font-bold">{errors.city}</p>}
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">State *</label>
                  <input type="text" value={form.state} onChange={(e) => setForm({...form, state: e.target.value})} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" />
                  {errors.state && <p className="text-rose-500 text-xs mt-1 font-bold">{errors.state}</p>}
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">Pincode (6 digits) *</label>
                  <input type="text" value={form.pincode} onChange={(e) => setForm({...form, pincode: e.target.value})} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" />
                  {errors.pincode && <p className="text-rose-500 text-xs mt-1 font-bold">{errors.pincode}</p>}
                </div>
              </div>

              <div className="pt-4">
                <button type="submit" disabled={submitting} className="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-base rounded-xl shadow-lg active:scale-95 disabled:opacity-50">
                  {submitting ? "Processing Payment..." : "Pay with Razorpay Test Mode 💳"}
                </button>
              </div>
            </form>

            <div className="bg-white p-6 rounded-3xl border border-slate-200 h-fit space-y-4 shadow-xs">
              <h3 className="font-extrabold text-lg text-slate-900 border-b border-slate-100 pb-2">Order Review</h3>
              <div className="space-y-3 max-h-64 overflow-y-auto pr-1">
                {cart.map(item => (
                  <div key={item.product?._id} className="flex justify-between items-center text-xs">
                    <div>
                      <p className="font-bold text-slate-900 line-clamp-1">{item.product?.name}</p>
                      <p className="text-slate-500">{item.quantity} × ₹{item.product?.price}</p>
                    </div>
                    <span className="font-extrabold text-slate-900">₹{((item.product?.price || 0) * item.quantity).toLocaleString("en-IN")}</span>
                  </div>
                ))}
              </div>
              <div className="pt-3 border-t border-slate-100 flex justify-between font-black text-lg">
                <span>Total Amount</span>
                <span className="text-indigo-600">₹{subtotal.toLocaleString("en-IN")}</span>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const OrderSuccessPage = () => {
      const { currentOrderId, orders, setPage } = useApp();
      const order = orders.find(o => o._id === currentOrderId) || orders[0];

      return (
        <div className="max-w-2xl mx-auto px-4 py-16 text-center animate-pop-in">
          <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-xl space-y-4">
            <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-3xl mx-auto font-black animate-bounce">✓</div>
            <h1 className="text-3xl font-black text-slate-900">Order Placed Successfully!</h1>
            <p className="text-slate-500 text-sm">Thank you for your purchase. Your payment signature has been verified.</p>

            {order && (
              <div className="p-5 bg-slate-50 rounded-2xl text-left text-xs space-y-2.5 border border-slate-200">
                <div className="flex justify-between"><span className="text-slate-500">Order ID:</span><span className="font-mono font-bold text-slate-900">{order._id}</span></div>

              </button>

                Continue Shopping
              </button>
            </div>
          </div>
        </div>

    };

    const OrdersPage = () => {
      const { orders, setPage } = useApp();

      return (
        <div className="max-w-5xl mx-auto px-4 py-8 animate-fade-in space-y-6">
          <h1 className="text-3xl font-extrabold text-slate-900 tracking-tight">My Orders 📦</h1>

          {orders.length === 0 ? (
            <div className="text-center py-20 bg-white rounded-3xl border border-slate-200 max-w-lg mx-auto animate-pop-in space-y-3">
              <div className="text-6xl animate-bounce">📦</div>
              <h3 className="text-xl font-bold text-slate-900">No orders placed yet</h3>
              <p className="text-slate-500 text-sm">Explore our products and place your first order.</p>
              <button onClick={() => setPage("products")} className="bg-indigo-600 text-white font-bold px-6 py-3 rounded-xl text-xs shadow-md">
                Browse Products
              </button>
            </div>
          ) : (
            <div className="space-y-6">
              {orders.map(order => (
                <div key={order._id} className="bg-white rounded-3xl border border-slate-200 p-6 shadow-xs card-hover space-y-4">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between border-b border-slate-100 pb-3 gap-2">
                    <div>
                      <span className="text-xs text-slate-400 font-mono">Order #{order._id}</span>
                      <p className="text-xs text-slate-500 mt-0.5">{new Date(order.createdAt).toLocaleDateString("en-IN", { day: 'numeric', month: 'short', year: 'numeric' })}</p>
                    </div>
                    <div className="flex items-center space-x-2">
                      <span className="bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs px-3 py-1 rounded-full font-bold">{order.status}</span>
                      <span className="bg-blue-50 text-blue-700 border border-blue-200 text-xs px-3 py-1 rounded-full font-bold">{order.paymentStatus}</span>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    {order.items?.map((item, idx) => (
                      <div key={idx} className="flex items-center space-x-3 bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                        <img src={item.image} alt={item.name} className="w-12 h-12 object-cover rounded-lg bg-white flex-shrink-0" />
                        <div className="text-xs">
                          <p className="font-bold text-slate-900 line-clamp-1">{item.name}</p>
                          <p className="text-slate-500">{item.quantity} × ₹{item.price}</p>

                  <div className="flex justify-between items-center border-t border-slate-100 pt-3 text-sm">
                    <span className="text-slate-600 font-semibold">Total Order Amount</span>
                    <span className="font-black text-slate-900 text-lg">₹{order.totalAmount?.toLocaleString("en-IN")}</span>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    };

    const LoginPage = () => {
      const { setUser, fetchUser, setPage, showToast } = useApp();
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [notRegistered, setNotRegistered] = useState(false);
      const [passwordError, setPasswordError] = useState("");

      const handleSubmit = async (e) => {
        e.preventDefault();
        setNotRegistered(false);
        setPasswordError("");

        if (!email.trim()) return showToast("Please enter your email address", "error");
        if (!password) return showToast("Please enter your password", "error");

        try {
          const res = await fetch("/customers/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
          });
          const data = await res.json();
          if (res.ok && data.success) {
            showToast("Login successful!");
            await fetchUser();
            setPage("products");
          } else {
            if (res.status === 404) setNotRegistered(true);
            else if (res.status === 401) setPasswordError(data.message || "Incorrect password!");
            showToast(data.message || "Invalid credentials", "error");
          }
        } catch (err) {
          showToast("Network error", "error");
        }
      };

      return (
        <div className="max-w-md mx-auto px-4 py-16 animate-pop-in">
          <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-xl space-y-4">
            <h2 className="text-2xl font-black text-slate-900 text-center">Customer Login</h2>

            {notRegistered && (
              <div className="bg-rose-50 border border-rose-200 text-rose-700 p-3.5 rounded-2xl text-xs font-bold flex items-center justify-between animate-pop-in">
                <span>Account not found. Please register first!</span>
                <button onClick={() => setPage("register")} className="bg-rose-600 text-white font-black px-3 py-1.5 rounded-xl text-xs hover:bg-rose-700 shadow-sm active:scale-95">
                  Register Now
                </button>
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Email Address</label>
                <input type="email" placeholder="Enter your email address" value={email} onChange={(e) => setEmail(e.target.value)} className="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Password</label>
                <input type="password" placeholder="Enter your password" value={password} onChange={(e) => setPassword(e.target.value)} className={`w-full px-3.5 py-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none ${passwordError ? "border-rose-500 focus:ring-rose-500" : "border-slate-300"}`} />
                {passwordError && <p className="text-rose-500 text-xs mt-1.5 font-bold animate-pop-in">⚠️ {passwordError}</p>}
              </div>
              <button type="submit" className="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl shadow-md active:scale-95">
                Log In
              </button>
            </form>
            <p className="text-center text-xs text-slate-500 pt-2">
              Don't have an account? <button onClick={() => setPage("register")} className="text-indigo-600 font-bold hover:underline">Register here</button>
            </p>
          </div>
        </div>
      );
    };

    const RegisterPage = () => {
      const { setPage, showToast } = useApp();
      const [form, setForm] = useState({ fullName: "", email: "", password: "", phone: "" });

      const handleSubmit = async (e) => {
        e.preventDefault();
        try {
          const res = await fetch("/customers/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(form)
          });
          const data = await res.json();
          if (res.ok && data.success) {
            showToast("Registration successful! Please log in.");
            setPage("login");
          } else {
            showToast(data.message || "Registration failed", "error");
          }
        } catch (err) {
          showToast("Network error", "error");
        }
      };

      return (
        <div className="max-w-md mx-auto px-4 py-16 animate-pop-in">
          <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-xl space-y-4">
            <h2 className="text-2xl font-black text-slate-900 text-center">Create Account</h2>
            <form onSubmit={handleSubmit} className="space-y-3">
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Full Name</label>
                <input type="text" value={form.fullName} onChange={(e) => setForm({...form, fullName: e.target.value})} className="w-full px-3.5 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Email</label>
                <input type="email" value={form.email} onChange={(e) => setForm({...form, email: e.target.value})} className="w-full px-3.5 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Password (&ge; 6 chars)</label>
                <input type="password" value={form.password} onChange={(e) => setForm({...form, password: e.target.value})} className="w-full px-3.5 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Phone Number</label>
                <input type="text" value={form.phone} onChange={(e) => setForm({...form, phone: e.target.value})} className="w-full px-3.5 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
              </div>
              <button type="submit" className="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl shadow-md active:scale-95 mt-2">
                Register
              </button>
            </form>
            <p className="text-center text-xs text-slate-500 pt-2">
              Already registered? <button onClick={() => setPage("login")} className="text-indigo-600 font-bold hover:underline">Login here</button>
            </p>
          </div>
        </div>
      );
    };

    const MainContent = () => {
      const { page, toast, selectedProductModal } = useApp();

      return (
        <div className="min-h-screen flex flex-col justify-between">
          <div>
            {toast && (
              <div className={`fixed bottom-6 right-6 z-50 px-5 py-3 rounded-2xl text-white font-bold text-sm shadow-xl animate-toast ${toast.type === "error" ? "bg-rose-600" : "bg-emerald-600"}`}>
                {toast.message}
              </div>
            )}

            <Navbar />

            <main>
              {page === "products" && <ProductsPage />}
              {page === "wishlist" && <WishlistPage />}
              {page === "cart" && <CartPage />}
              {page === "checkout" && <CheckoutPage />}
              {page === "success" && <OrderSuccessPage />}
              {page === "orders" && <OrdersPage />}
              {page === "login" && <LoginPage />}
              {page === "register" && <RegisterPage />}
            </main>

            {selectedProductModal && <ProductQuickViewModal />}
          </div>

          <footer className="bg-slate-900 text-slate-400 py-12 border-t border-slate-800 mt-16">
            <div className="max-w-7xl mx-auto px-4 grid grid-cols-1 md:grid-cols-4 gap-8">
              <div className="space-y-3">
                <div className="flex items-center space-x-2">
                  <div className="bg-indigo-600 text-white p-2 rounded-xl font-extrabold text-sm">SK</div>
                  <span className="font-extrabold text-xl text-white">ShopKart</span>
                </div>
                <p className="text-xs text-slate-400 leading-relaxed">
                  India's leading e-commerce platform for flagship audio, workstation accessories, wearables and premium fashion.
                </p>
              </div>

              <div>
                <h4 className="font-bold text-white text-xs uppercase tracking-wider mb-3">Quick Navigation</h4>
                <ul className="space-y-2 text-xs">
                  <li><a href="#" onClick={() => setPage("products")} className="hover:text-white">Product Catalogue</a></li>
                  <li><a href="#" onClick={() => setPage("wishlist")} className="hover:text-white">Wishlist</a></li>
                  <li><a href="#" onClick={() => setPage("cart")} className="hover:text-white">Shopping Cart</a></li>
                  <li><a href="#" onClick={() => setPage("orders")} className="hover:text-white">Order Tracking</a></li>
                </ul>
              </div>

              <div>
                <h4 className="font-bold text-white text-xs uppercase tracking-wider mb-3">Customer Service</h4>
                <ul className="space-y-2 text-xs">
                  <li><a href="#" className="hover:text-white">Help & Support</a></li>
                  <li><a href="#" className="hover:text-white">Shipping & Delivery</a></li>
                  <li><a href="#" className="hover:text-white">Returns & Exchanges</a></li>
                  <li><a href="#" className="hover:text-white">Privacy Policy</a></li>
                </ul>
              </div>

              <div className="space-y-3">
                <h4 className="font-bold text-white text-xs uppercase tracking-wider">Stay Updated</h4>
                <p className="text-xs text-slate-400">Subscribe for exclusive flash sale offers and tech discounts.</p>
                <div className="flex space-x-2">
                  <input type="email" placeholder="Enter email..." className="bg-slate-800 border border-slate-700 text-white px-3 py-2 rounded-xl text-xs focus:outline-none flex-1" />
                  <button className="bg-indigo-600 text-white font-bold px-4 py-2 rounded-xl text-xs hover:bg-indigo-700">Join</button>
                </div>
              </div>
            </div>
            <div className="max-w-7xl mx-auto px-4 mt-8 pt-8 border-t border-slate-800 text-center text-xs text-slate-500">
              © 2026 ShopKart E-Commerce Pvt. Ltd. All rights reserved. Powered by Node.js, Express, MongoDB & React.
            </div>
          </footer>
        </div>
      );
    };

    const App = () => (
      <AppProvider>
        <MainContent />
      </AppProvider>
    );

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
