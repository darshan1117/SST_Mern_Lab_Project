<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%3E<text y=%2226%22 font-size=%2228%22>🛒</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopKart. — Order your favourite products here</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Razorpay Checkout -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <!-- Outfit Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      body {
        font-family: 'Outfit', sans-serif;
        background-color: #ffffff;
        color: #262626;
        scroll-behavior: smooth;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes popIn {
        0% { transform: scale(0.92); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes toastSlide {
        from { transform: translateY(100%) scale(0.95); opacity: 0; }
        to { transform: translateY(0) scale(1); opacity: 1; }
      }
      .animate-fade-in { animation: fadeIn 0.35s ease-out forwards; }
      .animate-pop-in { animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .animate-toast { animation: toastSlide 0.25s ease-out forwards; }
      .tomato-btn {
        background-color: #ff4c24;
        color: #ffffff;
        transition: all 0.25s ease;
      }
      .tomato-btn:hover {
        background-color: #e53e1b;
        transform: translateY(-1px);
      }
      .tomato-btn:active {
        transform: scale(0.98);
      }
      .card-shadow {
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.08);
        transition: all 0.3s ease;
      }
      .card-shadow:hover {
        box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.12);
        transform: translateY(-4px);
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
